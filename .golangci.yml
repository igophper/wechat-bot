version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - nilerr
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      # Intentional best-effort cleanup must use an explicit _ = assignment.
      check-blank: false
      check-type-assertions: false
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: unexported-return
        - name: unreachable-code
  exclusions:
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
